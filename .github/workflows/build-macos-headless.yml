name: Build RustDesk macOS headless daemon

# Windowless macOS build: rustdesk runs the host server and never opens a window.
on:
  workflow_dispatch:
    inputs:
      upload-artifact:
        type: boolean
        default: true
        description: Upload build artifacts

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  VERSION: "1.5.0"
  UPLOAD_ARTIFACT: "${{ inputs['upload-artifact'] }}"

jobs:
  build-macos-headless:
    name: build rustdesk macos headless
    runs-on: macos-14
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-macos-headless

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet arm64-osx \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build headless daemon
        shell: bash
        run: |
          FEATURES=$(python3 build.py --headless --print-features)
          echo "features: $FEATURES"

          python3 res/inline-sciter.py

          MACOSX_DEPLOYMENT_TARGET=10.14 \
            cargo build --locked --release --features "$FEATURES"

          mkdir -p dist
          cp target/release/rustdesk dist/
          # Ship the installer helper so the archive is self-contained: it registers this daemon in
          # place as a launchd service that starts at boot, using the directory it is unpacked into.
          cp .github/scripts/install-service-macos.sh dist/install-service.sh
          chmod +x dist/install-service.sh
          ls -l dist
          # Distinct publish name: the executable inside keeps the name `rustdesk`, so without this
          # the windowless and windowed builds would overwrite each other when published.
          python3 -c "import shutil; shutil.make_archive('rustdesk-${{ env.VERSION }}-macos-arm64-headless', 'zip', 'dist')"
          ls -l rustdesk-${{ env.VERSION }}-macos-arm64-headless.zip

      - name: Upload artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-macos-arm64-headless
          path: rustdesk-${{ env.VERSION }}-macos-arm64-headless.zip
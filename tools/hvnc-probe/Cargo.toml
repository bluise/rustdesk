[package]
name = "hvnc-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone Windows probe for the hidden-desktop mechanism (RustDesk shadow-desktop, scheme C1)"

# Kept out of the repository workspace on purpose (see the root Cargo.toml).
# It only builds on Windows, and it must not slow down the real builds.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "wingdi",
    "processthreadsapi",
    "handleapi",
    "errhandlingapi",
    "winbase",
    "winnt",
    "basetsd",
    "minwindef",
    "ntdef",
    "windef",
] }

[[bin]]
name = "hvnc-probe"
path = "src/main.rs"

# Standalone workspace root on purpose: without this, cargo walks up to the repository
# manifest and tries to load every RustDesk member just to build a Windows-only probe.
[workspace]

# This probe doubles as the local compile check for the crate's shadow-desktop module
# (see src/main.rs), so the include is on by default; pass --no-default-features to prove
# the module really stays out of the build when the feature is off.
[features]
default = ["shadow-desktop"]
shadow-desktop = []